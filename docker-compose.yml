# DotEye - docker-compose.
#
# Два сценария:
#   1) Всё на одной машине (камера + инференс):  docker compose up doteye
#   2) Инференс на сервере с GPU:               docker compose --profile remote up remote
#      а на машине с камерой в .env:
#        DOTEYE_REMOTE_PROCESSING=1
#        DOTEYE_REMOTE_URL=http://<server-ip>:8099
#
# .env и data/ монтируются, чтобы секреты и БД не попадали в образ.

services:
  doteye:
    build: .
    image: doteye:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    # Доступ к вебкамере хоста (Linux). На Windows/macOS нужен V4L2-проброс
    # или внешняя камера по RTSP - тогда devices не нужен.
    devices:
      - /dev/video0:/dev/video0
      # Динамики хоста для сирены и TTS (Linux). Если /dev/snd нет -
      # закомментируй строку, голос просто не заиграет.
      # - /dev/snd:/dev/snd
    # Для GPU раскомментируй (нужен nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  remote:
    build: .
    image: doteye:latest
    profiles: ["remote"]
    restart: unless-stopped
    environment:
      # Remote не должен получать токен Telegram и настройки бота.
      DOTEYE_CRYPTO_KEY: ${DOTEYE_CRYPTO_KEY:?DOTEYE_CRYPTO_KEY is required}
    command: ["python", "-m", "doteye.remote_server", "--host", "0.0.0.0", "--port", "8099"]
    ports:
      # По умолчанию доступен только с хоста. Для внешней камеры используй VPN
      # или TLS reverse proxy, не публикуй этот HTTP-порт напрямую в интернет.
      - "127.0.0.1:8099:8099"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Для ARM (Raspberry Pi) раскомментируй:
    # platform: linux/arm64

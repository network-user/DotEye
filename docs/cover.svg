<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="DotEye">
  <title>DotEye</title>
  <defs>
    <linearGradient id="de-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0b0d"/>
      <stop offset="0.5" stop-color="#14161a"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>
    <radialGradient id="de-glow" cx="72%" cy="50%" r="48%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="de-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#de-bg)"/>
  <rect width="1600" height="900" fill="url(#de-glow)"/>
  <g opacity="0.045" stroke="#ffffff" stroke-width="1">
    <path d="M0 180 H1600 M0 360 H1600 M0 540 H1600 M0 720 H1600 M320 0 V900 M640 0 V900 M960 0 V900 M1280 0 V900"/>
  </g>
  
  <!-- Камера-глаз справа -->
  <circle cx="1140" cy="450" r="140" fill="url(#de-halo)"/>
  <g fill="none" stroke="#f3f3f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="1140" cy="450" rx="95" ry="70"/>
    <circle cx="1140" cy="450" r="38"/>
    <circle cx="1140" cy="450" r="18" fill="#f3f3f1"/>
  </g>
  
  <!-- Текст -->
  <text x="140" y="420" font-family="Inter, Arial, sans-serif" font-size="110" font-weight="800" fill="#f3f3f1" letter-spacing="-2">DotEye</text>
  <text x="146" y="480" font-family="Inter, Arial, sans-serif" font-size="28" fill="#a6a7ab">видеонаблюдение и охрана</text>
</svg>
